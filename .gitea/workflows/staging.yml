# Gitea Actions (homelab staging) — private deploy to stream.local.herruzo.me
#
# Push to main = build + deploy to the Docker-host staging stack. GitHub Pages
# workflow (.github/workflows/deploy.yml) stays for the public site; Gitea runs
# only *.local.herruzo.me names.
#
# NOTE: single job, NO actions/upload-artifact — Gitea implements the v1
# artifact backend and rejects @actions/artifact v2+ (upload-artifact@v4) with
# "not currently supported on GHES". The runner runs on the Docker host with the
# host docker.sock, so the job container can bind-mount the live dist/ directly.
name: Staging (homelab)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    runs-on: homelab
    container:
      image: node:20-bookworm
      volumes:
        # <host path>:<container path> — resolved against the runner's host.
        - /opt/stacks/staging/stream-analyzer/dist:/dist
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm ci

      - name: Lint (hard gate)
        run: npm run lint

      # Typecheck is ADVISORY on purpose: main carries pre-existing tsc errors
      # (view-model.js, summary-generator.js) that sit mid-refactor in the
      # working tree. Blocking staging on type debt would freeze deploys, so
      # this reports and continues. The GitHub workflow keeps it strict.
      - name: Typecheck (advisory)
        continue-on-error: true
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      # The SRT helper cannot run in the browser; it is built for all
      # platforms and served as plain static files from dist/helper/ next to
      # the site (analysis doc: static-only mandate).
      - name: Build SRT helper (static, all platforms) and manifest
        run: |
          curl -sLO "https://go.dev/dl/$(curl -s 'https://go.dev/dl/?mode=json' | grep -o '"version": "go1\.[0-9.]*"' | head -1 | grep -o 'go1\.[0-9.]*').linux-amd64.tar.gz"
          rm -rf /usr/local/go && tar -C /usr/local -xzf go1.*.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          bash scripts/build-helper.sh "$(pwd)" "$(node -p "require('./package.json').version")"
          mkdir -p dist/helper
          cp -a tools/srt-helper/bin/. dist/helper/
          cp tools/srt-helper/manifest.json dist/helper/manifest.json
          echo "helper artifacts:" && ls dist/helper/

      - name: Deploy to staging dist
        run: |
          test -f dist/index.html
          # clear stale files, then publish the fresh build
          find /dist -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a dist/. /dist/
          echo "deployed $(find /dist -type f | wc -l) files"

      - name: Verify
        run: |
          test -f /dist/index.html && echo "staging content live"
          test -f /dist/helper/manifest.json && echo "helper manifest live"
